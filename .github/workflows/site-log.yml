name: Site log

# The Changes page renders src/changes/site-log.json, a committed file: Pages checks the
# repo out at fetch-depth 1, and a published page should not depend on a history that can
# be rewritten. Nothing appended to it, though - a push landed and the log sat where it
# was until someone remembered to run the drafter by hand.
#
# This runs the drafter on every push to main, commits what it drafted, and asks Pages to
# deploy the result. It appends only: merge() adds days, pages and lines and never
# rewrites one, so a line corrected by hand stays corrected and can still be corrected
# afterwards.
#
# It cannot write about itself. Its own commits are docs(changes), which site-log.js
# skips, and the log's own files map to no page in the first place - two independent
# reasons, which is what makes the loop safe rather than lucky.

on:
  push:
    branches: [main]
    paths-ignore:
      - src/changes/site-log.json
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to ask Pages to deploy what this commits

# Never cancel: a cancelled run can have written the file and not pushed it.
concurrency:
  group: site-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the drafter reads git log; depth 1 carries no history

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No npm ci: the drafter is node builtins, git, and the repo's own files.
      #
      # Preview first and commit only when there is a line to add. A push that logs
      # nothing - tooling, CI, a refactor, the log itself - should not leave a commit
      # saying so, and re-reading those commits on the next run costs nothing because
      # the drafter is idempotent.
      - id: draft
        run: |
          set +e
          node src/changes/site-log.js > draft.txt 2>&1
          code=$?
          cat draft.txt
          if [ $code -ne 0 ]; then
            echo "::error::the drafter failed; the log is unchanged"
            exit 1
          fi
          if grep -q 'nothing to add' draft.txt; then
            echo "state=clean" >> "$GITHUB_OUTPUT"
          else
            echo "state=new" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.draft.outputs.state == 'new'
        id: write
        run: |
          node src/changes/site-log.js --write
          summary=$(sed -n 's/^\([0-9][0-9]*\) line(s) over \([0-9][0-9]*\) day(s).*/\1 line(s) over \2 day(s)/p' draft.txt)
          echo "summary=${summary:-new entries}" >> "$GITHUB_OUTPUT"

      - if: steps.draft.outputs.state == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, not interpolated into the script: the value is the
          # drafter's own count and cannot carry a quote, but a run block is not the
          # place to rely on that.
          SUMMARY: ${{ steps.write.outputs.summary }}
        run: |
          if git diff --quiet -- src/changes/site-log.json; then
            echo "::warning::the drafter listed lines but wrote no change"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/changes/site-log.json
          git commit -m "docs(changes): log $SUMMARY"

          # main can have moved while this ran. Rebasing a one-file append is safe: the
          # worst case is that the next run re-reads a commit already logged, and adds
          # nothing for it.
          pushed=
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=1; break; fi
            echo "push attempt $i failed; retrying"
            sleep 5
          done
          if [ -z "$pushed" ]; then
            echo "::error::could not push the log"
            exit 1
          fi

          # A push made with GITHUB_TOKEN triggers no workflow, by design. The deploy that
          # ran for the commit this just logged therefore built without the new line, so
          # ask for one more that has it.
          gh workflow run pages.yml --ref main
