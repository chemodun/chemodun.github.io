name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages serves an uploaded artifact, so nothing generated is ever committed.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The navigation panel's wiki half is a committed snapshot, refreshed here so a
      # deploy publishes the wiki's tree as it is today. The snapshot is the fallback,
      # not the fetch: wiki.egosoft.com being unreachable must not fail a deploy of
      # this site, so the build carries on with what is in the repository.
      - run: npm run wiki:fetch ||
          echo "::warning::the Egosoft wiki is unreachable; building from the committed tree.json"
      - run: npm run build
      # A page can build byte-perfect and still be inert, so nothing is uploaded
      # until a real browser has loaded every page without a console error.
      - run: node src/check-pages.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
